<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decimen Optical Transfer — send</title>
    <meta name="theme-color" content="#070a11" />
    <link rel="icon" href="../decimen_logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body class="tool-page">
    <header class="site-header">
      <a class="brand" href="../"><svg class="brand-logo" viewBox="0 0 543 554.1" fill="currentColor" aria-hidden="true"><g transform="translate(-241,789) scale(0.1,-0.1)"><path d="M2410 6513 l0 -1378 103 101 c540 531 1324 986 1984 1153 402 102 850 95 1268 -21 529 -146 1300 -581 1860 -1050 175 -146 212 -184 199 -205 -37 -63 -502 -432 -754 -600 -969 -644 -1785 -844 -2590 -634 -667 174 -1376 581 -1947 1118 l-123 115 0 -1382 0 -1381 1478 4 c1291 3 1491 5 1588 20 1345 194 2240 1124 2355 2446 17 195 7 620 -19 786 -192 1236 -1030 2069 -2262 2249 -217 32 -411 36 -1772 36 l-1368 0 0 -1377z"/><path d="M4945 5906 c-300 -68 -532 -287 -611 -577 -25 -89 -25 -289 0 -378 141 -513 724 -749 1179 -477 405 242 503 778 209 1148 -100 125 -258 229 -417 273 -82 22 -282 29 -360 11z"/></g></svg>Decimen Optical Transfer</a>
      <a class="mode-switch" href="../receive/" aria-label="Switch to Receive" title="Switch to Receive">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3 4 7l4 4" /><path d="M4 7h16" /><path d="m16 21 4-4-4-4" /><path d="M20 17H4" />
        </svg>
      </a>
    </header>
    <main class="send-shell">
      <section class="tool-intro">
        <p class="eyebrow">Screen → camera</p>
        <h1 id="tool-title">SEND</h1>
        <p>Nothing leaves your device until you scan with a receiver.</p>
      </section>

      <div class="mode-picker" id="mode-picker" role="radiogroup" aria-label="What to send">
        <label>
          <input type="radio" name="send-mode" value="file" checked />
          <span>File</span>
        </label>
        <label>
          <input type="radio" name="send-mode" value="snippet" />
          <span>Text snippet</span>
        </label>
      </div>

      <div class="hint status-line" id="specs">Choose a file to begin</div>

      <label class="file-picker" id="pane-file">
        <span id="file-picker-label">Any file · up to %MAX_FILE_LABEL%</span>
        <input id="cfg-file" type="file" />
      </label>

      <div class="demo-picker" id="pane-demo" hidden>
        <span>Demo payload</span>
        <div class="demo-buttons">
          <button type="button" data-demo="success.png">512 KB image</button>
          <button type="button" data-demo="success-2mb.png">2 MB image</button>
        </div>
      </div>

      <div class="note-composer" id="pane-snippet" hidden>
        <label for="snippet-text" id="snippet-label">Text to send</label>
        <textarea id="snippet-text" rows="7" placeholder="Paste or type anything — a URL, a config, a wall of text…"></textarea>
        <button id="send-snippet" type="button">Start text stream</button>
      </div>

      <div class="stage" id="stage" hidden><canvas id="qr" width="16" height="16"></canvas></div>
      <details class="settings">
        <summary>Transfer settings</summary>
        <div class="row">
          <label>
            profile
            <select id="cfg-profile">
              <option value="compatibility" selected>Compatibility</option>
              <option value="grid">4× QR Grid</option>
              <option value="color">Color Grid</option>
            </select>
          </label>
          <label>
            tx fps
            <!-- Options come from shared/send-settings.ts via htmlTokens() -->
            <select id="cfg-fps">%TX_FPS_OPTIONS%</select>
          </label>
          <label>
            bytes / frame
            <select id="cfg-bytes">%FRAME_BYTES_OPTIONS%</select>
          </label>
          <label>
            error correction
            <select id="cfg-ecc">
              <option selected>L</option><option>M</option><option>Q</option><option>H</option>
            </select>
          </label>
          <label>
            display size
            <input id="cfg-size" type="range" min="300" max="1200" step="50" value="900" />
          </label>
        </div>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
